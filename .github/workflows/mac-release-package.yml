name: macOS Signed Release Packages

on:
  workflow_run:
    workflows: ["macOS Preview Candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Resources/Info.plist, for example v1.8.13
        required: true
        type: string

concurrency:
  group: mac-signed-package-${{ inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'release/pre-v'))
    name: Sign and notarize Apple Silicon and Intel packages
    runs-on: macos-15
    timeout-minutes: 180
    environment: mac-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_DEVELOPER_TEAM_ID: 34T8V3NA4P
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Check out release candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve candidate branch, version, and tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            candidate_branch="$WORKFLOW_BRANCH"
            expected_sha="$WORKFLOW_SHA"
          else
            candidate_branch="$GITHUB_REF_NAME"
            expected_sha="$(git rev-parse HEAD)"
          fi
          if [[ ! "$candidate_branch" =~ ^release/pre-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release workflow requires a release/pre-vX.Y.Z candidate branch" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected_sha"
          git switch -C "$candidate_branch"
          version="${candidate_branch#release/pre-v}"
          tag="${REQUESTED_TAG:-v$version}"
          test "$tag" = "v$version"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE_BRANCH=$candidate_branch" >> "$GITHUB_ENV"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate candidate and create matching tag
        run: |
          ./scripts/verify-preview-branch.sh
          remote_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_commit" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Remote Mic ${RELEASE_TAG#v}"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$remote_tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "existing tag $RELEASE_TAG does not point to candidate HEAD" >&2
            exit 1
          fi

      - name: Check out readonly release credentials
        uses: actions/checkout@v5
        with:
          repository: MaydayV/remotemic-notary-secrets
          path: .private-release/remotemic-notary-secrets
          ssh-key: ${{ secrets.RELEASE_CREDENTIALS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out readonly Match signing identities
        uses: actions/checkout@v5
        with:
          repository: MaydayV/apple-signing-match
          path: .private-release/apple-signing-match
          ssh-key: ${{ secrets.APPLE_SIGNING_MATCH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install required tools
        run: brew install age fastlane ripgrep

      - name: Prepare protected release identity
        env:
          RELEASE_AGE_IDENTITY: ${{ secrets.RELEASE_AGE_IDENTITY }}
        run: |
          test -n "$RELEASE_AGE_IDENTITY"
          release_identity="$RUNNER_TEMP/remotemic-release.agekey"
          umask 077
          printf '%s' "$RELEASE_AGE_IDENTITY" > "$release_identity"
          chmod 600 "$release_identity"
          {
            echo "AGE_IDENTITY_FILE=$release_identity"
            echo "RELEASE_CREDENTIALS_REPO=$GITHUB_WORKSPACE/.private-release/remotemic-notary-secrets"
            echo "MATCH_REPO=$GITHUB_WORKSPACE/.private-release/apple-signing-match"
          } >> "$GITHUB_ENV"

      - name: Validate release identity
        run: |
          version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          test "$RELEASE_TAG" = "v$version"
          ./scripts/verify-preview-branch.sh

      - name: Run Apple Silicon release gates
        env:
          RELEASE_VARIANT: apple-silicon
        run: |
          swift test
          ./scripts/test.sh

      - name: Run Intel Ventura release gates
        env:
          RELEASE_VARIANT: intel
        run: |
          swift test
          ./scripts/test.sh
          swift build -c release --triple x86_64-apple-macosx13.0

      - name: Sign, notarize, staple, and verify both variants
        run: ./scripts/package-macos-release-in-actions.sh

      - name: Publish signed GitHub pre-release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh prerelease

      - name: Upload signed release packages
        uses: actions/upload-artifact@v4
        with:
          name: remote-mic-${{ steps.release.outputs.tag }}-signed-macos
          path: |
            dist/Remote-Mic-*.dmg
            dist/Remote-Mic-*.dmg.sha256
            dist/Remote-Mic-*.zip
            dist/Remote-Mic-*.txt
            dist/Install Remote Mic.pkg
            dist/Uninstall Remote Mic.pkg
            dist/appcast.xml
            dist/intel/Remote-Mic-*-Intel.dmg
            dist/intel/Remote-Mic-*-Intel.dmg.sha256
            dist/intel/Remote-Mic-*-Intel.zip
            dist/intel/Remote-Mic-*-Intel.*.txt
            dist/intel/Install Remote Mic Intel.pkg
            dist/intel/Uninstall Remote Mic Intel.pkg
            dist/intel/appcast-intel.xml
          if-no-files-found: error
          retention-days: 14
